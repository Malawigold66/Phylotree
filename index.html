<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Arbre phylogénétique du vivant</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>
:root{--ac:#d97757;--bg:#0b0d12;--tx:#e6e8ee;--mut:#8b93a7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#161a24,#0b0d12 70%);color:var(--tx);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
#svg{position:fixed;inset:0;width:100%;height:100%;cursor:grab}
#svg:active{cursor:grabbing}
.glass{background:rgba(26,29,38,.55);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.09);box-shadow:0 8px 32px rgba(0,0,0,.35)}
#side{position:fixed;top:14px;right:14px;bottom:52px;width:350px;display:flex;flex-direction:column;overflow:hidden;border-radius:16px}
#ctl{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#info{padding:14px;overflow-y:auto;flex:1;user-select:text;-webkit-user-select:text}
#axis{position:fixed;left:0;right:0;bottom:0;height:40px;border-radius:0;border-width:1px 0 0}
#axsvg text{fill:#aab2c5;font-size:11px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}
.ttl{font-size:15px}
.mut{color:var(--mut)}
input[type=text]{width:100%;padding:7px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:var(--tx);outline:none;margin:6px 0}
input[type=text]:focus{border-color:var(--ac)}
input.bad{border-color:#e55!important}
.dm{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0}
.dm label,.fx label{display:flex;align-items:center;gap:5px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
input[type=checkbox]{accent-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}
button,select{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:6px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#1a0f0a;font-weight:600}
summary{cursor:pointer;color:var(--mut);margin-top:6px}
.fx{display:flex;flex-direction:column;gap:5px;margin-top:6px}
#info h2{margin:0 0 2px;font-size:19px}
#info h4{margin:12px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#info p{margin:4px 0}
#info ul{margin:4px 0;padding-left:18px}
.chip{display:inline-block;padding:2px 9px;margin:2px 3px 2px 0;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);cursor:pointer;font-size:12px}
a.chip:hover{border-color:var(--ac)}
.crumbs{font-size:11px;color:var(--mut);margin-bottom:8px}
.crumbs a{cursor:pointer}.crumbs a:hover{color:var(--ac)}
.deb{margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(217,119,87,.14);border:1px solid rgba(217,119,87,.45)}
.age{display:inline-block;padding:2px 9px;border-radius:8px;background:rgba(217,119,87,.18);color:#f0b9a4;margin:4px 0}
/* svg */
.nd{cursor:pointer}
.nd path{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-opacity:.7}
.nd.pth path{stroke-width:3.4;stroke-opacity:1}
.nd circle{fill:var(--bg);stroke:var(--c);stroke-width:2}
.nd.lf circle{fill:var(--c)}
.nd.cp circle{fill:var(--bg);stroke-width:3.5}
.nd.sel circle{fill:#fff;stroke:var(--c);stroke-width:3}
.lb{fill:#d7dae3;font-size:var(--fs,12px);paint-order:stroke;stroke:#0b0d12;stroke-width:3.5px;stroke-linejoin:round}
.nd.sel .lb,.nd.pth .lb{fill:#fff}
.nd.sel .lb{font-weight:700}
.nd{transition:opacity .25s}
.hasSel .nd:not(.pth):not(.sel){opacity:.35}
.exl{fill:#8b93a7;display:none}
.zx .exl{display:inline}
#grid path{stroke:rgba(255,255,255,.07);stroke-dasharray:3 6;vector-effect:non-scaling-stroke;fill:none}
.fx-glow .nd.sel circle{filter:url(#glow)}
.fx-glow .nd.pth path{filter:url(#glow)}
.nd.pth path.h,.nd.pth path.vh,.nd.pth path.v,.nd.sel path{stroke-width:2;stroke-opacity:.7}
.nd path.gl,.nd.pth path.gl{display:none!important}
.hasSel .nd.pth path,.hasSel .nd.sel path{stroke-opacity:.3!important}
#hl{pointer-events:none}
.hasSel .nd.sub.sub.sub{opacity:1}
.hasSel .nd.sub path{stroke-width:2.8;stroke-opacity:1}
.hasSel .nd.sel.sub path{stroke-opacity:1!important;stroke-width:2.8!important}
.hasSel .nd.sub circle{stroke-width:2.6}
.mkg path{fill:#ffd27a;stroke:#0b0d12;stroke-width:1;cursor:pointer}
.mkg:hover path{fill:#fff}
.mkl{fill:#ffd27a;font-size:calc(var(--fs,12px)*.8);display:none;paint-order:stroke;stroke:#0b0d12;stroke-width:3px;pointer-events:none}
.zi .mkl{display:inline}
.cvl{stroke-dasharray:5 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cvd{vector-effect:non-scaling-stroke;pointer-events:none}
.fx-flow .cvl{animation:cvdash 1.4s linear infinite}
@keyframes cvdash{to{stroke-dashoffset:-10}}
#side,#axis{z-index:5}
#v3{position:fixed;left:0;top:0;bottom:0;right:380px;display:none;z-index:1;overflow:hidden}
#v3.on{display:block}
#v3 canvas{display:block;width:100%;height:100%;cursor:grab}
body.m3 #svg,body.m3 #axis{display:none}
.l3{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;color:#e6e8ee;text-shadow:0 0 3px #0b0d12,0 0 3px #0b0d12,0 0 3px #0b0d12;pointer-events:none;display:none}
.l3.sel{color:#fff;font-weight:700}
.l3.rl{color:#8b93a7;font-size:11px}
.l3.pl{color:#fff;font-size:11px;background:rgba(11,13,18,.6);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:1px 6px;text-shadow:none}
#tip3{position:absolute;left:0;top:0;display:none;pointer-events:none;padding:6px 9px;border-radius:9px;max-width:260px;font-size:12px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head><body>
<svg id="svg"><defs><clipPath id="tclip"><rect id="tclr" x="-1000000" y="-1000000" width="2000000" height="2000000"/></clipPath><filter id="glow" filterUnits="userSpaceOnUse" x="-300" y="-300" width="6000" height="7000"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g id="vp"><g id="grid"></g><g id="ext"></g><g id="cv"></g><g id="nodes"></g><g id="mk"></g><g id="hl"></g></g></svg>
<div id="v3"><div id="lb3"></div><div id="tip3" class="glass"></div></div>
<div id="side" class="glass">
 <div id="ctl">
  <div class="row"><b class="ttl">Arbre phylogénétique du vivant</b><span class="hbtn"><button id="b_sheet" aria-label="Menu"></button><button id="b_lang" title="Langue / Language"><span id="lg_fr" class="on">FR</span> | <span id="lg_en">EN</span></button></span></div>
  <input type="text" id="q" placeholder="Rechercher (ex. kangourou) + Entrée">
  <div class="dm" id="doms"></div>
  <div class="dm"><label><input type="checkbox" id="c_inn" checked><span class="dot" style="background:#ffd27a"></span>Innovations ◆</label><label><input type="checkbox" id="c_cv" checked><span class="dot" style="background:#e0609a"></span>Convergences</label></div>
  <div class="row"><span>Convergence</span><select id="cvsel"></select></div>
  <div class="dm"><label><input type="checkbox" id="c_auto" checked>Déplier les descendants à la sélection</label></div>
  <details open id="dtime"><summary>⏳ Temps et extinctions</summary>
  <div class="dm"><label><input type="checkbox" id="c_ext"><span class="dot" style="background:#ff5a5f"></span>Extinctions de masse ☠</label></div>
  <div id="exchips"></div>
  <div class="row"><span>Voyage dans le temps : <b id="tcv">Aujourd’hui</b></span><button id="b_tnow">↺</button></div>
  <input type="range" id="tcut" min="0" max="1000" step="1" value="1000">
  </details>
  <div class="row"><span>Niveaux dépliés : <b id="dv"></b></span></div>
  <input type="range" id="depth" min="1" value="1" step="1">
  <div class="row"><button id="b_all">Tout déplier</button><button id="b_fit">Vue d'ensemble</button></div>
  <div class="row"><button id="b_3d" class="pri" style="width:100%">Vue 3D</button></div>
  <div class="row"><span>Style 3D</span><select id="s3sel"><option value="cone">Cône (net)</option><option value="coral">Corail</option><option value="oak">Chêne</option></select></div>
  <div class="row"><span>Écartement <b id="s3v">1.0×</b></span><input type="range" id="s3sp" min="0.5" max="2" step="0.1" value="1" style="width:55%"></div>
  <details><summary>Effets</summary><div class="fx">
   <label>Qualité <select id="qual"><option value="h">Haute</option><option value="m">Moyenne</option><option value="l">Basse</option></select></label>
   <label><input type="checkbox" id="fx_grid" checked> Grille temporelle</label>
   <label><input type="checkbox" id="fx_glow" checked> Lueur (sélection)</label>
   <label><input type="checkbox" id="fx_anim" checked> Transitions de caméra</label>
   <label><input type="checkbox" id="fx_flow" checked> Pointillés animés</label>
   <label><input type="checkbox" id="fx3_pts" checked> 3D : nœuds lumineux</label>
   <label><input type="checkbox" id="fx3_stars" checked> 3D : fond étoilé</label>
   <label><input type="checkbox" id="fx3_ring" checked> 3D : anneaux temporels</label>
   <label><input type="checkbox" id="fx3_rot"> 3D : rotation automatique</label>
   <label><input type="checkbox" id="fx3_flow" checked> 3D : flux lumineux sur la lignée</label>
   <label>3D : taille des marqueurs <input type="range" id="fx3_msz" min="0.6" max="1.6" step="0.05" value="1"></label>
  </div></details>
 </div>
 <div id="info"></div>
</div>
<div id="axis" class="glass"><svg id="axsvg" width="100%" height="40"></svg></div>

const CV=[
{id:"cv_eye",nm:"Œil de type caméra",c:"#f2e94e",ids:["cephal","vert","cubo"],d:"Céphalopodes, vertébrés et cubozoaires (méduses-boîtes) ont chacun inventé un œil à cristallin et rétine. Chez les céphalopodes, les photorécepteurs sont tournés vers la lumière : pas de point aveugle."},
{id:"cv_wing",nm:"Vol battu (ailes)",c:"#5ec8e5",ids:["pteryg","pter","aves","bat"],d:"Quatre inventions indépendantes du vol actif : insectes (≈ 400 Ma), ptérosaures (≈ 230 Ma), oiseaux (≈ 150 Ma), chauves-souris (≈ 60 Ma). Structures différentes : expansion de cuticule, membrane sur le 4e doigt, plumes, membrane entre les doigts."},
{id:"cv_echo",nm:"Écholocation",c:"#c792ea",ids:["odont","bat"],d:"Chauves-souris et odontocètes émettent des ultrasons et analysent les échos. La protéine Prestin (audition) montre des substitutions convergentes chez les deux groupes."},
{id:"cv_hydro",nm:"Forme hydrodynamique",c:"#4fa3ff",ids:["elas","ichthyo","odont","teleo"],d:"Requins, ichtyosaures, dauphins et thons ont un corps fusiforme, une nageoire dorsale et une queue en croissant, malgré des ancêtres très différents."},
{id:"cv_sea",nm:"Retour à la vie marine",c:"#38d6b0",ids:["cetac","siren","ichthyo","plesio","mosa","sphen2"],d:"Des tétrapodes ont plusieurs fois quitté la terre pour la mer : cétacés, siréniens, ichtyosaures, plésiosaures, mosasaures, manchots. Membres en nageoires, adaptations à la plongée."},
{id:"cv_c4",nm:"Photosynthèse C4",c:"#9be15d",ids:["p_poac","p_caryo","p_astera","p_cyper","p_malp"],d:"Apparue indépendamment plus de 60 fois chez les angiospermes, surtout depuis ≈ 30 Ma (baisse du CO2) : maïs et canne à sucre (poacées), amarantes (caryophyllales), Flaveria (astéracées)."},
{id:"cv_cam",nm:"Photosynthèse CAM",c:"#d4e157",ids:["p_caryo","p_orch","p_lyco","p_brome","p_aspar"],d:"Stomates ouverts la nuit pour économiser l'eau : cactus, nombreuses orchidées, et même certains isoètes aquatiques (lycophytes)."},
{id:"cv_carn",nm:"Plantes carnivores",c:"#ff6b6b",ids:["p_caryo","p_lami","p_eric","p_brome"],d:"Au moins une dizaine d'origines indépendantes : Drosera et Népenthès (caryophyllales), Utriculaire et Pinguicula (lamiales), et d'autres ordres."},
{id:"cv_multi",nm:"Pluricellularité complexe",c:"#ff9f43",ids:["anim","f_dik","s_brun","p_embryo","m_dict"],d:"Origine indépendante chez animaux, champignons, algues brunes, plantes terrestres ; Dictyostelium y arrive par agrégation. Si l'on compte les formes simples (Volvox, myxobactéries, cyanobactéries filamenteuses), plus de vingt origines."},
{id:"cv_pri",nm:"Endosymbioses primaires du plaste",c:"#62c26a",ids:["plant","s_cerc"],d:"Les Archaeplastida (≈ 1,5 Ga) et Paulinella (≈ 100 Ma) ont chacun domestiqué une cyanobactérie en plaste."},
{id:"cv_sec",nm:"Endosymbioses secondaires",c:"#7bd88f",ids:["s_stram","e_eugl","s_crypt"],d:"Un eucaryote en avale un autre, photosynthétique : algue rouge (straménopiles, cryptophytes) ou algue verte (euglènes). Plastes à 3–4 membranes."},
{id:"cv_fung",nm:"Mode de vie fongique",c:"#d6b13a",ids:["s_oomy","fung"],d:"Les oomycètes (mildiou) ont un mycélium et absorbent leurs nutriments comme les champignons, mais sont proches des algues brunes."},
{id:"cv_anox",nm:"Photosynthèse anoxygénique",c:"#6c9bff",ids:["b_chloro","b_chlorobi","b_proteo"],d:"Plusieurs lignées bactériennes captent la lumière sans produire d'O2. Leur répartition (transferts horizontaux de gènes ?) reste débattue."},
{id:"cv_soc",nm:"Eusocialité",c:"#e0609a",ids:["hymen","dict","rod"],d:"Colonies à reine et individus stériles : fourmis et abeilles (hyménoptères), termites (dictyoptères), rat-taupe nu (rongeurs)."},
{id:"cv_ves",nm:"Vaisseaux du xylème",c:"#b5e48c",ids:["p_gnet","p_angio"],d:"Les gnétophytes ont des vaisseaux de type angiosperme, apparus indépendamment des fleurs."},
{id:"cv_tree",nm:"Port arborescent",c:"#a0c4a0",ids:["p_lepido","p_arch","p_conif","p_palm"],d:"Troncs et arbres inventés plusieurs fois, avec des mécanismes de croissance en épaisseur différents : lépidodendrons, Archaeopteris, conifères, palmiers (sans bois secondaire)."},
{id:"cv_scale",nm:"Écailles de kératine",c:"#ffb4a2",ids:["pholi","squam"],d:"Les pangolins (mammifères) portent des écailles de kératine, comme les squamates, par convergence."},
{id:"cv_para",nm:"Parasitisme des plantes",c:"#e6a8d7",ids:["p_malp","p_santal","p_lami","p_magn"],d:"Au moins une douzaine d'origines indépendantes : Rafflesia (malpighiales), gui et santal (santalales), orobanches (lamiales), Cassytha (lauracées). Les haustoriums se ressemblent, mais viennent de lignées sans lien."},
{id:"cv_myco",nm:"Mycohétérotrophie",c:"#b08968",ids:["p_orch","p_eric","p_hep"],d:"Plantes sans photosynthèse qui se nourrissent via un champignon : orchidées (Neottia), Monotropa (ericales) et l'hépatique Aneura mirabilis. Plusieurs dizaines d'origines indépendantes."},
{id:"cv_nfix",nm:"Symbiose fixatrice d'azote",c:"#80ed99",ids:["p_fab","p_fag","p_rosac"],d:"Légumineuses (Rhizobium, nodules) et plantes actinorhiziennes (Alnus, Casuarina, Dryas ; actinobactéries Frankia). Elles appartiennent au même clade ancestral (fabidées), mais la nodulation est apparue ou a été conservée plusieurs fois."},
{id:"cv_aqua",nm:"Retour à l'eau (angiospermes)",c:"#90e0ef",ids:["p_nymph","p_alism","p_cerat"],d:"Nénuphars, herbiers marins (posidonie, zostère), cornifle : des plantes à fleurs ont plusieurs fois recolonisé l'eau, jusqu'à la pollinisation sous l'eau."},
{id:"cv_fouis",nm:"Vie fouisseuse (taupes)",c:"#c9a27e",ids:["eulip","afros","rod"],d:"Taupes (eulipotyphles), taupes dorées (afrothériens) et rats-taupes (rongeurs) ont chacun évolué des pattes avant en pelles, des yeux réduits et un corps cylindrique."},
{id:"cv_myrm",nm:"Régime myrmécophage",c:"#e5989b",ids:["pilo","pholi","afro","mono"],d:"Fourmilier (xénarthre), pangolin, oryctérope (afrothérien) et échidné (monotrème) : museau allongé, langue collante, dents réduites ou absentes, régime de fourmis et de termites."},
{id:"cv_glide",nm:"Vol plané",c:"#8ecae6",ids:["derm","dipro","rod"],d:"Galéopithèques, phalangers volants (marsupiaux) et écureuils volants (rongeurs) planent grâce à une membrane de peau tendue entre les membres."},
{id:"cv_spine",nm:"Piquants",c:"#d4a373",ids:["eulip","mono","rod","afros"],d:"Hérissons, échidnés, porcs-épics (rongeurs) et tenrecs hérissons : des poils ont été transformés en piquants de kératine, plusieurs fois indépendamment."},
{id:"cv_venin",nm:"Venin",c:"#b5179e",ids:["cnid","arach","serp","hymen","mono","eulip"],d:"Cnidaires, araignées et scorpions, serpents, hyménoptères, ornithorynque (éperon du mâle) et musaraignes ou solénodons (salive venimeuse). Origines indépendantes, souvent à partir de protéines digestives ou de défense recrutées."},
{id:"cv_biolum",nm:"Bioluminescence",c:"#48cae4",ids:["s_dino","cteno","cnid","cephal","teleo","coleo","b_proteo"],d:"Dinoflagellés, cténophores, méduses, calmars, poissons abyssaux, lucioles et bactéries (Vibrio) produisent de la lumière. Plus de 40 origines indépendantes estimées."},
{id:"cv_electro",nm:"Électroréception et électrogenèse",c:"#ffd60a",ids:["chond","teleo","mono"],d:"Requins et raies (ampoules de Lorenzini), poissons électriques et mormyres (téléostéens) et ornithorynque détectent les champs électriques ; plusieurs lignées de poissons en produisent aussi."},
{id:"cv_endo",nm:"Endothermie",c:"#ff8fa3",ids:["mamm","aves","teleo","elas"],d:"Le sang chaud est apparu séparément chez les mammifères et les oiseaux, avec des formes partielles chez les thons (téléostéens) et les requins lamnidés."},
{id:"cv_heart",nm:"Cœur à quatre cavités",c:"#e63946",ids:["mamm","croc","aves"],d:"Mammifères d'un côté, archosaures (crocodiliens et oiseaux) de l'autre : deux origines indépendantes de ventricules entièrement séparés."},
{id:"cv_land",nm:"Conquête de la terre",c:"#a7c957",ids:["p_embryo","arach","insec","myria","pulm","tetra"],d:"Plantes (≈ 500 Ma), arthropodes (≈ 430 à 420 Ma), vertébrés (≈ 375 Ma) et gastéropodes pulmonés ont chacun colonisé les continents, avec des solutions différentes contre la dessiccation et pour respirer l'air."},
{id:"cv_shell",nm:"Squelette minéralisé externe",c:"#caf0f8",ids:["moll","brach","echino","s_foram","s_diat"],d:"Coquilles de carbonate de calcium (mollusques, brachiopodes, foraminifères), test des échinodermes, frustule de silice des diatomées : plusieurs inventions indépendantes, surtout vers la limite Édiacarien-Cambrien."},
{id:"cv_color",nm:"Changement de couleur actif",c:"#f4a261",ids:["cephal","saur","teleo"],d:"Céphalopodes, caméléons (lézards) et certains poissons modulent leur couleur par des cellules pigmentaires (chromatophores, iridophores), pour le camouflage ou la communication."},
{id:"cv_viv",nm:"Viviparité",c:"#f28482",ids:["ther","ichthyo","squam","elas","teleo"],d:"Mammifères thériens, ichtyosaures, squamates, requins et certains téléostéens (hippocampe, guppy) gardent leurs embryons. Elle est apparue environ une centaine de fois chez les squamates seuls."},
{id:"cv_horn",nm:"Cornes, bois et défenses",c:"#dda15e",ids:["rumi","rhino","ornith","probo"],d:"Cornes de kératine (rhinocéros), bois (cervidés), cornes osseuses (bovidés), cornes des cératopsiens (Tricératops) et défenses des éléphants : des armes ou parades apparues séparément."},
{id:"cv_neck",nm:"Long cou",c:"#bc6c25",ids:["sauropod","plesio","rumi"],d:"Sauropodes, plésiosaures (Elasmosaurus) et girafes ont allongé le cou, chacun par une voie anatomique différente (nombre ou longueur des vertèbres)."},
{id:"cv_beak",nm:"Bec corné",c:"#ffba08",ids:["aves","testu","cephal","pter"],d:"Oiseaux, tortues, céphalopodes (bec de perroquet) et ptérosaures plus tardifs ont remplacé les dents par un bec de kératine ou de chitine."},
{id:"cv_wind",nm:"Pollinisation par le vent",c:"#bde0fe",ids:["p_conif","p_poales","p_fag"],d:"Conifères, graminées, chênes et bouleaux dispersent un pollen léger et abondant. Chez les angiospermes, elle est dérivée de la pollinisation par les animaux."},
{id:"cv_epi",nm:"Épiphytisme",c:"#74c69d",ids:["p_brome","p_orch","p_foug"],d:"Broméliacées, orchidées et fougères vivent sur d'autres plantes, avec des racines aériennes ou des citernes foliaires."},
{id:"cv_succ",nm:"Succulence",c:"#95d5b2",ids:["p_caryo","p_aspar","p_malp"],d:"Cactus (caryophyllales), agaves et aloès (asparagales), euphorbes (malpighiales) stockent l'eau dans leurs tissus : forme semblable, familles sans lien."},
{id:"cv_mito",nm:"Mitochondries réduites (mitosomes)",c:"#9d8df1",ids:["e_meta","f_roz","s_api"],d:"Giardia (métamonades), microsporidies et Cryptosporidium (apicomplexes) ont réduit leurs mitochondries en mitosomes, vie anaérobie ou parasitaire."}

const EXT=[
{id:"x_ord",nm:"Extinction de la fin de l’Ordovicien",short:"Fin-Ordovicien",a:445,per:"Ordovicien terminal (Hirnantien), ≈ 445 Ma",pct:"≈ 85 % des espèces marines (≈ 60 % des genres), en deux pulses séparés par quelques centaines de milliers d’années.",cause:"Refroidissement brutal et glaciation sur le Gondwana : le niveau marin chute et détruit les habitats des mers peu profondes. À la fonte, le retour du réchauffement s’accompagne d’une anoxie des océans. Le refroidissement est attribué à une baisse du CO2 (altération de roches fraîches de chaînes de montagnes en formation) et/ou à du volcanisme.",eff:"Graptolites, trilobites, brachiopodes, conodontes, coraux, bryozoaires et échinodermes très touchés. La vie est alors presque exclusivement marine : cette crise remodèle les écosystèmes des mers paléozoïques.",ids:["trilob","brach","conod"],deb:"Origine exacte du refroidissement (altération des silicates, volcanisme) discutée ; une hypothèse de sursaut gamma reste très spéculative."},
{id:"x_dev",nm:"Extinction du Dévonien supérieur",short:"Dévonien sup.",a:372,per:"Frasnien-Famennien (Kellwasser, ≈ 372 Ma) et Hangenberg (≈ 359 Ma)",pct:"≈ 75 % des espèces, surtout marines. Série de pulses plutôt qu’un événement unique.",cause:"Épisodes d’anoxie océanique et de bouleversements climatiques. Hypothèse majeure : l’expansion des premières forêts (Archaeopteris, racines profondes) accélère l’altération des sols et déverse des nutriments dans les mers, d’où eutrophisation, blooms d’algues et eaux sans oxygène. Autres facteurs invoqués : refroidissement, volcanisme, variations du niveau marin, impacts.",eff:"Effondrement des grands récifs (stromatopores, coraux), déclin des trilobites, disparition des placodermes à la fin du Dévonien. Les tétrapodes traversent ensuite le « creux de Romer », période pauvre en fossiles.",ids:["plac","ostrac","trilob","p_arch"],deb:"Pas de cause unique admise : rôle des plantes terrestres, du volcanisme et des impacts débattu ; certains auteurs parlent d’une longue crise."},
{id:"x_perm",nm:"Extinction de la fin du Permien (« la Grande Mortalité »)",short:"Fin-Permien",a:252,per:"Permien-Trias, ≈ 252 Ma",pct:"≈ 80 à 95 % des espèces marines, ≈ 70 % des vertébrés terrestres ; seule extinction de masse notable chez les insectes. La plus grave connue.",cause:"Éruptions massives des trapps de Sibérie (millions de km² de basaltes en moins d’un million d’années) : libération de CO2, de méthane, de SO2 et d’halogènes. Conséquences : réchauffement extrême, acidification et anoxie des océans, atteinte de la couche d’ozone. Les gaz issus de la combustion de charbon et de matière organique ont pu amplifier le phénomène.",eff:"Disparition des trilobites, des euryptérides, de nombreux coraux et brachiopodes. La reprise dure 5 à 10 Ma. Elle ouvre la voie aux archosaures, puis aux dinosaures, et plus tard aux mammifères.",ids:["trilob","synb","p_ptero","stego"],deb:"La cause volcanique est largement admise ; le poids relatif de chaque mécanisme (CO2, méthane, acidification, anoxie) reste discuté."},
{id:"x_tri",nm:"Extinction de la fin du Trias",short:"Fin-Trias",a:201,per:"Trias-Jurassique, ≈ 201 Ma",pct:"≈ 75 % des espèces (≈ 50 % des genres).",cause:"Éruptions de la grande province magmatique de l’Atlantique central (CAMP), liées à l’ouverture de l’Atlantique : pics de CO2, réchauffement, acidification des océans et anoxie. L’impact de Manicouagan, daté bien plus tôt, n’est pas retenu comme cause principale.",eff:"Conodontes disparus, nombreux ammonites et reptiles marins, grands amphibiens et archosaures non dinosauriens éliminés. Les dinosaures, libérés de leurs concurrents, dominent le Jurassique.",ids:["conod","ammon","synb"],deb:"Durée de l’événement et rôle exact du CAMP par rapport à d’autres facteurs encore débattus."},
{id:"x_kpg",nm:"Extinction de la fin du Crétacé (K-Pg)",short:"Fin-Crétacé",a:66,per:"Crétacé-Paléogène, ≈ 66 Ma",pct:"≈ 75 % des espèces.",cause:"Impact d’un astéroïde d’une dizaine de kilomètres à Chicxulub (Yucatán) : onde de choc, tsunamis, incendies, puis « hiver d’impact » (poussières et soufre bloquant la lumière, arrêt de la photosynthèse) et acidification. Les éruptions des trapps du Deccan, avant et pendant l’événement, ont fragilisé les écosystèmes.",eff:"Disparition des dinosaures non aviens, des ptérosaures, des mosasaures, des plésiosaures, des ammonites et des rudistes. Survivent oiseaux, mammifères, crocodiliens, tortues et lézards, qui se diversifient ensuite.",ids:["nonav","ornith","sauropod","pter","ammon","mosa","plesio"],deb:"Le rôle respectif de l’impact et du volcanisme du Deccan est discuté ; l’impact est considéré comme le déclencheur principal par la majorité des spécialistes."}
];

{id:"luca",e:"🧬",t:"Tout commence ici",x:"Il y a ≈ 4 Ga, une cellule (ou une population de cellules) dont tous les êtres vivants actuels descendent. ADN, ARN, ribosomes et code génétique : le même pour tous.",f:"Tu partages ce code génétique avec une bactérie : c’est la preuve d’un ancêtre commun."},
{id:"b_cyano",e:"🌊",t:"Les bactéries inventent l’oxygène",x:"Les cyanobactéries inventent la photosynthèse oxygénique. Leur oxygène sature peu à peu les océans puis l’air : la Grande Oxydation, vers −2,4 Ga.",f:"Pour la plupart des microbes de l’époque, l’oxygène était un poison. Ce fut la première grande crise écologique."},
{id:"euk",e:"🔬",t:"Une cellule en avale une autre",x:"Les eucaryotes ont un noyau, des organites et des mitochondries, issues d’une bactérie avalée mais pas digérée (endosymbiose).",f:"Tes mitochondries ont encore leur propre petit ADN, hérité de cette bactérie."},
{id:"anim",e:"🪼",t:"Les cellules s’organisent",x:"Les animaux : pluricellularité, collagène, cellules sexuelles différenciées. Éponges, cténophores et placozoaires sont à la base.",f:"La pluricellularité est apparue des dizaines de fois : chez les animaux, les plantes, les champignons et les algues brunes."},
{id:"bilat",e:"🪱",t:"Un avant et un arrière",x:"Symétrie bilatérale, tube digestif de la bouche à l’anus, mésoderme, gènes Hox et début de cerveau à l’avant (céphalisation).",f:"Presque tous les animaux qui se déplacent activement sont bilatériens, y compris toi."},
{id:"chord",e:"〰️",t:"Une baguette dans le dos",x:"Les chordés ont une notochorde, un tube nerveux dorsal et des fentes pharyngiennes. Le petit amphioxus ressemble au chordé ancestral.",f:"Chez l’humain, la notochorde devient les disques entre les vertèbres."},
{id:"vert",e:"🧠",t:"Un crâne et une colonne",x:"Les vertébrés : crête neurale, crâne, colonne vertébrale, cœur à chambres, yeux et oreille interne complexes.",f:"La crête neurale est parfois appelée le « quatrième feuillet embryonnaire »."},
{id:"gnath",e:"🦈",t:"Des mâchoires !",x:"Un arc branchial se transforme en mâchoire. Apparaissent aussi les nageoires paires et l’immunité adaptative (anticorps).",f:"Tes mâchoires sont des branchies recyclées."},
{id:"sarco",e:"🐟",t:"Des nageoires charnues",x:"Cœlacanthes, dipneustes et ancêtres des tétrapodes : nageoires à os articulés, poumons fonctionnels et narines internes (choanes).",f:"Le cœlacanthe, cru éteint depuis 66 Ma, a été retrouvé vivant en 1938."},
{id:"tetra",e:"🦎",t:"Les pieds sur terre",x:"Quatre membres à doigts, cou mobile, respiration aérienne. Les premiers tétrapodes (Ichthyostega, Tiktaalik) vivaient encore dans l’eau.",f:"Tes doigts viennent de nageoires : les premiers tétrapodes en avaient 6 à 8."},
{id:"amni",e:"🥚",t:"L’œuf qui se passe d’eau",x:"L’amnios offre à l’embryon sa propre petite « mer » : plus besoin de retourner dans l’eau pour pondre. Peau étanche, fécondation interne.",f:"Un œuf de poule est un étang miniature."},
{id:"mamm",e:"🥛",t:"Poils, lait et sang chaud",x:"Les mammifères ont des poils, des glandes mammaires, l’endothermie et trois osselets dans l’oreille moyenne.",f:"Deux de ces osselets étaient à l’origine des os de la mâchoire."},
{id:"ther",e:"🤰",t:"Des bébés vivants",x:"Les thériens sont vivipares : marsupiaux (poche) et placentaires (placenta développé).",f:"Les monotrèmes, eux, pondent encore des œufs : ornithorynque et échidnés."},
{id:"prim",e:"🐒",t:"Des mains pour attraper",x:"Pouces opposables, ongles plats, vision stéréoscopique : la vie dans les arbres façonne les primates.",f:"Ta vision en relief, c’est un héritage de ces ancêtres arboricoles."},
{id:"hom",e:"🦍",t:"Plus de queue",x:"Les hominoïdes (gibbons et grands singes) n’ont plus de queue et se balancent sous les branches.",f:"Ton coccyx est le vestige de cette queue."},
{id:"sapi",e:"🧑",t:"Te voilà !",x:"Homo sapiens, ≈ 0,3 Ma : langage, culture cumulative, agriculture. Il a fallu ≈ 4 Ga de vie pour y arriver.",f:"Ce chemin n’est qu’une lignée parmi des millions. Chaque feuille de l’arbre a sa propre histoire."}

"cv_eye":{nm:"Camera-type eye",d:"Cephalopods, vertebrates and cubozoans (box jellyfish) each independently invented an eye with a lens and a retina. In cephalopods the photoreceptors face the light: there is no blind spot."},
"cv_wing":{nm:"Flapping flight (wings)",d:"Four independent inventions of powered flight: insects (≈ 400 Ma), pterosaurs (≈ 230 Ma), birds (≈ 150 Ma), bats (≈ 60 Ma). Different structures: cuticle expansion, membrane on the 4th finger, feathers, membrane between the fingers."},
"cv_echo":{nm:"Echolocation",d:"Bats and toothed whales emit ultrasound and analyze the echoes. The protein Prestin (hearing) shows convergent substitutions in both groups."},
"cv_hydro":{nm:"Hydrodynamic body shape",d:"Sharks, ichthyosaurs, dolphins and tuna have a spindle-shaped body, a dorsal fin and a crescent-shaped tail, despite very different ancestors."},
"cv_sea":{nm:"Return to marine life",d:"Tetrapods left land for the sea several times: cetaceans, sirenians, ichthyosaurs, plesiosaurs, mosasaurs, penguins. Flipper-like limbs, adaptations to diving."},
"cv_c4":{nm:"C4 photosynthesis",d:"Arose independently more than 60 times in angiosperms, mostly since ≈ 30 Ma (falling CO2): maize and sugarcane (grasses), amaranths (Caryophyllales), Flaveria (Asteraceae)."},
"cv_cam":{nm:"CAM photosynthesis",d:"Stomata open at night to save water: cacti, many orchids, and even some aquatic quillworts (lycophytes)."},
"cv_carn":{nm:"Carnivorous plants",d:"At least ten independent origins: sundews (Drosera) and tropical pitcher plants (Nepenthes) (Caryophyllales), bladderworts (Utricularia) and butterworts (Pinguicula) (Lamiales), and other orders."},
"cv_multi":{nm:"Complex multicellularity",d:"Independent origin in animals, fungi, brown algae and land plants; Dictyostelium gets there by aggregation. If simple forms are counted (Volvox, myxobacteria, filamentous cyanobacteria), more than twenty origins."},
"cv_pri":{nm:"Primary plastid endosymbioses",d:"The Archaeplastida (≈ 1.5 Ga) and Paulinella (≈ 100 Ma) each domesticated a cyanobacterium into a plastid."},
"cv_sec":{nm:"Secondary endosymbioses",d:"One eukaryote swallows another, photosynthetic one: a red alga (stramenopiles, cryptophytes) or a green alga (euglenids). Plastids with 3–4 membranes."},

"cv_aqua":{nm:"Return to water (angiosperms)",d:"Water lilies, seagrasses (Posidonia, eelgrass), hornwort (Ceratophyllum): flowering plants recolonized water several times, even achieving underwater pollination."},

"cv_myrm":{nm:"Ant-eating diet",d:"Anteater (xenarthran), pangolin, aardvark (afrotherian) and echidna (monotreme): elongated snout, sticky tongue, reduced or absent teeth, diet of ants and termites."},

"cv_heart":{nm:"Four-chambered heart",d:"Mammals on one side, archosaurs (crocodilians and birds) on the other: two independent origins of fully separated ventricles."},
"cv_land":{nm:"Conquest of land",d:"Plants (≈ 500 Ma), arthropods (≈ 430 to 420 Ma), vertebrates (≈ 375 Ma) and pulmonate gastropods each colonized the continents, with different solutions against desiccation and for breathing air."},
"cv_shell":{nm:"External mineralized skeleton",d:"Calcium carbonate shells (mollusks, brachiopods, foraminifera), the echinoderm test, the silica frustule of diatoms: several independent inventions, mostly around the Ediacaran–Cambrian boundary."},
"cv_color":{nm:"Active color change",d:"Cephalopods, chameleons (lizards) and some fishes modulate their color with pigment cells (chromatophores, iridophores), for camouflage or communication."},
"cv_viv":{nm:"Viviparity",d:"Therian mammals, ichthyosaurs, squamates, sharks and some teleosts (seahorse, guppy) retain their embryos. It arose about a hundred times in squamates alone."},
"cv_horn":{nm:"Horns, antlers and tusks",d:"Keratin horns (rhinoceroses), antlers (deer), bony horns (bovids), ceratopsian horns (Triceratops) and elephant tusks: weapons or displays that arose separately."},

const tEnd2=e=>{if(e.touches.length<2)TZ=null;};

/* ===== PATCH INTEGRE ===== */
/* Mode integre (utilise dans une fiche du Pokedex) : adresse ?embed=1&lang=fr|en&n=Nom1|Nom2|...
   n = noms possibles, du plus precis au plus general (espece | genre | famille | ordre | classe...). L'arbre selectionne le premier
   qui existe (le chemin depuis la racine se surligne comme a un clic) et previent la page parente par postMessage. */
{
 const PQ=new URLSearchParams(location.search);
 const key=s=>norm(s).replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+/g," ").trim();
 const EXA=new Map(),GEN=new Map();                    /* nom normalise -> noeud (le plus profond gagne) */
 const put=(m,k,n)=>{if(!k)return;const o=m.get(k);if(!o||n.depth>o.depth)m.set(k,n)};
 ALL.forEach(n=>{
  [n.sci,n.fr,n.vn,n.nm].concat(n.al||[]).concat(n.exfr||n.ex||[]).filter(Boolean).forEach(x=>{
   const t=String(x),p=t.match(/\(([^)]+)\)/);
   put(EXA,key(t),n);if(p)put(EXA,key(p[1]),n);
   if(/^[A-Z][a-zA-Z-]+ [a-z-]+$/.test(t))put(GEN,key(t).split(" ")[0],n);   /* binome : son genre pointe vers le meme groupe */
  });
 });
 const trouver=noms=>{
  for(let i=0;i<noms.length;i++){
   const k=key(noms[i]);if(!k)continue;
   let n=EXA.get(k),via="nom";
   if(!n){n=GEN.get(k);via="genre"}
   if(n)return{node:n,idx:i,name:noms[i],via:via};
  }
  return null;
 };
 /* Un observateur de l'arbre ouvre le panneau a chaque changement de fiche (voulu au toucher) : on le met en sourdine
    pendant les actions venant de la page parente, sinon le panneau masquerait le chemin. */
 let CALME=false;const fOpen0=fOpen;fOpen=function(){if(CALME)return;return fOpen0.apply(this,arguments)};
 const calme=f=>{CALME=true;try{f()}finally{setTimeout(()=>{CALME=false},0)}};
 const prevenir=m=>{try{if(parent!==window)parent.postMessage(Object.assign({pk:"tree"},m),"*")}catch(x){}};
 const appliquer=noms=>{
  const r=trouver(noms);
  if(r){calme(()=>select(r.node.id));prevenir({type:"match",found:true,idx:r.idx,name:r.name,via:r.via,id:r.node.id,nm:r.node.nm,sci:r.node.sci||"",depth:r.node.depth})}
  else prevenir({type:"match",found:false});
  return r;
 };
 window.addEventListener("message",ev=>{
  const d=ev.data;if(!d||d.pk!=="tree")return;
  if(d.type==="lang"&&(d.lang==="fr"||d.lang==="en")&&d.lang!==LANG)calme(()=>setLang(d.lang));
  if(d.type==="select"&&Array.isArray(d.names))appliquer(d.names.map(String));
 });
 if(PQ.get("lang")==="en"&&LANG!=="en")calme(()=>setLang("en"));
 const noms=(PQ.get("n")||"").split("|").map(x=>x.trim()).filter(Boolean);
 if(noms.length)appliquer(noms);
 prevenir({type:"ready"});
}
/* ===== FIN PATCH INTEGRE ===== */
})();
